<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 有機’島茶 茶席區 每日席位表</title>
    
    <!-- 引入 PapaParse 用來自動解析 Google Sheet 的 CSV 資料 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- 引入 Tailwind CSS 讓表格排版自動變美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f5f1; }
        .table-container { overflow-x: auto; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th, td { border: 1px solid #d1d5db; padding: 12px; text-align: center; }
        th { background-color: #4b5563; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-center text-emerald-800 mb-6">2026 有機’島茶 茶席區 每日席位表</h1>
        
        <div id="loading" class="text-center text-gray-500 py-10 text-lg">
            資料載入中，請稍候...
        </div>

        <div id="table-wrapper" class="table-container hidden">
            <table id="schedule-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 將你原本的 pubhtml 網址改成 output=csv 格式，即可讓網頁自動讀取
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNFwBpZ_uwSAPgPaeKhfgZgwKnkCoSbV_ApgmgpQ8_KIqpm_iHKNrpiq-z71vUUWJBMEmvqRjsEfwb/pub?gid=1255472775&single=true&output=csv';

        Papa.parse(csvUrl, {
            download: true,
            header: false, // 因為我們要手動對應 A~E 欄
            complete: function(results) {
                const data = results.data;
                if (data.length > 0) {
                    renderTable(data);
                } else {
                    document.getElementById('loading').innerText = "找不到資料，請確認試算表狀態。";
                }
            },
            error: function(err) {
                console.error("讀取錯誤: ", err);
                document.getElementById('loading').innerText = "載入失敗，請確認網路連線。";
            }
        });

        function renderTable(data) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            // 處理第一列 (A1~E1 標題列)
            let headerHtml = '<tr>';
            for (let i = 0; i < 5; i++) { // 索引 0~4 代表 A 到 E 欄
                headerHtml += `<th>${data[0][i] || ''}</th>`;
            }
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            // 處理內容 (從 A2 開始，直到最後一筆資料)
            let bodyHtml = '';
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                
                // 檢查該列 A~E 是否完全空白，如果是空白行就跳過不顯示
                const isEmpty = row.slice(0, 5).every(cell => !cell || cell.trim() === '');
                if (isEmpty) continue;

                bodyHtml += '<tr>';
                for (let j = 0; j < 5; j++) {
                    const cellValue = row[j] || '';
                    bodyHtml += `<td>${cellValue}</td>`;
                }
                bodyHtml += '</tr>';
            }
            tbody.innerHTML = bodyHtml;

            // 隱藏載入中文字，顯示表格
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('table-wrapper').classList.remove('hidden');
        }
    </script>
</body>
</html>
