<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 有機’島茶 茶席區 每日席位表</title>
    
    <!-- 引入 PapaParse 與 Tailwind CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f4f5f1; }
        .table-container { overflow-x: auto; }
        table { width: 100%; min-width: 750px; border-collapse: collapse; table-layout: fixed; }
        
        /* 統一設定表格格線與內距 */
        td { border: 1px solid #d1d5db; padding: 10px 6px; text-align: center; word-wrap: break-word; }
        
        /* 欄位精準寬度控制 */
        .data-row td:nth-child(1), .sub-header td:nth-child(1) { width: 52px; white-space: nowrap; } /* 席次：緊湊縮小 */
        .data-row td:nth-child(2), .sub-header td:nth-child(2) { width: 52px; white-space: nowrap; } /* 編號：緊湊縮小 */
        .data-row td:nth-child(3), .sub-header td:nth-child(3) { width: 35%; } /* 茶園名稱：大幅加寬 */
        .data-row td:nth-child(4), .sub-header td:nth-child(4) { width: 85px; white-space: nowrap; } /* 茶師 */
        .data-row td:nth-child(5), .sub-header td:nth-child(5) { width: auto; } /* 自信作 */

        /* 跨欄大標題樣式 */
        .section-header td {
            background-color: #065f46;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding: 12px;
        }

        /* 欄位名稱列樣式 */
        .sub-header td {
            background-color: #e5e7eb;
            color: #374151;
            font-weight: bold;
        }

        /* 資料列 hover 效果 */
        .data-row:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-5xl mx-auto bg-white p-4 md:p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-emerald-800 mb-6">2026 有機’島茶 茶席區 每日席位表</h1>
        
        <!-- 篩選與搜尋列 -->
        <div id="filter-container" class="mb-6 flex flex-col md:flex-row justify-center items-center gap-4 hidden">
            <!-- 日期下拉選單 -->
            <div class="flex items-center w-full md:w-auto">
                <label for="date-filter" class="font-bold text-gray-700 mr-2 whitespace-nowrap">📅 選擇日期：</label>
                <select id="date-filter" class="w-full md:w-auto border-2 border-emerald-600 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-emerald-50 cursor-pointer shadow-sm transition" onchange="applyFilters()">
                    <option value="all">顯示全部場次 (10/03 ~ 10/11)</option>
                </select>
            </div>

            <!-- 編號搜尋框 -->
            <div class="flex items-center w-full md:w-auto">
                <label for="id-search" class="font-bold text-gray-700 mr-2 whitespace-nowrap">🔍 搜尋編號：</label>
                <input type="text" id="id-search" placeholder="輸入編號 (如: 36)" class="w-full md:w-40 border-2 border-emerald-600 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-emerald-50 shadow-sm transition" oninput="applyFilters()">
            </div>
        </div>

        <div id="loading" class="text-center text-gray-500 py-10 text-lg">
            資料載入中，請稍候...
        </div>

        <div id="no-result" class="text-center text-amber-800 bg-amber-50 border border-amber-200 p-6 rounded-lg hidden text-lg font-medium my-4">
            <!-- 搜尋無結果時顯示 -->
        </div>

        <div id="table-wrapper" class="table-container hidden">
            <table id="schedule-table">
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNFwBpZ_uwSAPgPaeKhfgZgwKnkCoSbV_ApgmgpQ8_KIqpm_iHKNrpiq-z71vUUWJBMEmvqRjsEfwb/pub?gid=1255472775&single=true&output=csv';
        
        let allSections = [];
        let uniqueDates = new Set();

        Papa.parse(csvUrl, {
            download: true,
            header: false,
            complete: function(results) {
                processData(results.data);
            }
        });

        function processData(rawData) {
            allSections = [];
            uniqueDates.clear();

            let currentDate = "";
            let currentSection = null;

            for (let i = 0; i < rawData.length; i++) {
                let row = rawData[i];
                let col0 = (row[0] || '').trim();

                // 忽略完全空白列與總標題
                if (row.slice(0, 5).every(cell => !cell || cell.trim() === '')) continue;
                if (col0.includes("每日席位表")) continue;

                // 1. 偵測日期列 (例如 "10/03(六)" 或帶有空格的 "10/04 (日) 十茶席位表")
                let dateMatch = col0.match(/(\d{1,2}\/\d{1,2})\s*\(([一二三四五六日])\)/);
                if (dateMatch) {
                    // 統一格式為 "10/04(日)" (去除中間的空白)
                    currentDate = `${dateMatch[1]}(${dateMatch[2]})`;
                    uniqueDates.add(currentDate);
                    continue; // 濾掉該列，不將舊的雜項標題印在表格內
                }

                // 2. 偵測時段 (上午 / 下午) 並自動判斷平日與假日的結束時間
                if (col0.includes("上午")) {
                    let sectionTitle = `${currentDate} 上午 09:00-13:00`;
                    currentSection = {
                        date: currentDate,
                        title: sectionTitle,
                        headers: ["席次", "編號", "茶園名稱", "茶師", "自信作"],
                        rows: []
                    };
                    allSections.push(currentSection);
                }
                else if (col0.includes("下午")) {
                    // 判斷平日 (10/05一 ~ 10/08四) 下午為 13:30-16:30，其餘為 13:30-17:30
                    let isWeekday = currentDate.includes("10/05") || currentDate.includes("10/06") || currentDate.includes("10/07") || currentDate.includes("10/08");
                    let timeStr = isWeekday ? "下午 13:30-16:30" : "下午 13:30-17:30";
                    
                    let sectionTitle = `${currentDate} ${timeStr}`;
                    currentSection = {
                        date: currentDate,
                        title: sectionTitle,
                        headers: ["席次", "編號", "茶園名稱", "茶師", "自信作"],
                        rows: []
                    };
                    allSections.push(currentSection);
                }
                // 3. 標題列 ("席次")
                else if (col0 === "席次") {
                    if (currentSection) {
                        let hRow = [...row].slice(0, 5);
                        if (hRow[1] === "銷編") hRow[1] = "編號";
                        currentSection.headers = hRow;
                    }
                }
                // 4. 一般茶席資料列
                else {
                    if (currentSection) {
                        currentSection.rows.push(row.slice(0, 5));
                    }
                }
            }

            buildFilterOptions();
            applyFilters();
        }

        function buildFilterOptions() {
            const select = document.getElementById('date-filter');
            select.innerHTML = '<option value="all">顯示全部場次 (10/03 ~ 10/11)</option>';
            
            uniqueDates.forEach(date => {
                let option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                select.appendChild(option);
            });
            document.getElementById('filter-container').classList.remove('hidden');
        }

        // 核心篩選邏輯：同時比對日期與編號
        window.applyFilters = function() {
            const selectedDate = document.getElementById('date-filter').value;
            const searchTerm = document.getElementById('id-search').value.trim().toLowerCase();
            const tbody = document.getElementById('table-body');
            const noResult = document.getElementById('no-result');
            
            let html = '';
            let totalMatches = 0;

            for (let sec of allSections) {
                // 日期過濾
                if (selectedDate !== 'all' && sec.date !== selectedDate) continue;

                // 編號過濾
                let matchedRows = sec.rows.filter(row => {
                    if (!searchTerm) return true;
                    let idVal = String(row[1] || '').trim().toLowerCase();
                    return idVal.includes(searchTerm);
                });

                if (matchedRows.length > 0) {
                    totalMatches += matchedRows.length;

                    // 跨欄綠底大標題
                    html += `<tr class="section-header"><td colspan="5">${sec.title}</td></tr>`;
                    
                    // 欄位標題
                    html += `<tr class="sub-header">`;
                    for (let h of sec.headers) {
                        html += `<td>${h || ''}</td>`;
                    }
                    html += `</tr>`;
                    
                    // 茶席資料列
                    for (let r of matchedRows) {
                        html += `<tr class="data-row">`;
                        for (let i = 0; i < 5; i++) {
                            let cellVal = r[i] || '';
                            // 若有搜尋編號，符合者以黃底高亮顯示
                            if (i === 1 && searchTerm) {
                                html += `<td class="font-bold text-emerald-900 bg-amber-200">${cellVal}</td>`;
                            } else {
                                html += `<td>${cellVal}</td>`;
                            }
                        }
                        html += `</tr>`;
                    }
                }
            }

            // 無結果提示
            if (totalMatches === 0) {
                tbody.innerHTML = '';
                document.getElementById('table-wrapper').classList.add('hidden');
                noResult.innerHTML = `查無編號「<span class="text-red-600 font-bold">${searchTerm}</span>」的茶席資料，請確認編號是否正確。`;
                noResult.classList.remove('hidden');
            } else {
                tbody.innerHTML = html;
                noResult.classList.add('hidden');
                document.getElementById('table-wrapper').classList.remove('hidden');
            }

            document.getElementById('loading').classList.add('hidden');
        }
    </script>
</body>
</html>
